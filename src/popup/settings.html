<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beyond Full Art</title>
  </head>
  <body class="bfa-popup">
    <main class="bfa-popup__main">
      <p class="bfa-popup__eyebrow">Beyond Full Art</p>
      <h1 class="bfa-popup__title">Extension settings</h1>
      <p class="bfa-popup__description">
        Control optional D&amp;D Beyond enhancements without changing the site layout.
      </p>

      <section class="bfa-popup__section" aria-labelledby="campaign-portraits-heading">
        <label class="bfa-popup__toggle" for="campaign-card-portrait-upgrade">
          <input
            id="campaign-card-portrait-upgrade"
            class="bfa-popup__checkbox"
            type="checkbox">
          <span>
            <span id="campaign-portraits-heading" class="bfa-popup__label">
              Improve character card portraits
            </span>
            <span class="bfa-popup__hint">
              Loads sharper portraits on D&amp;D Beyond campaign and My Characters cards.
            </span>
          </span>
        </label>
        <p
          id="campaign-card-portrait-upgrade-status"
          class="bfa-popup__status bfa-popup__status--hidden"
          aria-live="polite"></p>
      </section>

      <section class="bfa-popup__section" aria-labelledby="character-journal-heading">
        <label class="bfa-popup__toggle" for="character-journal-enabled">
          <input
            id="character-journal-enabled"
            class="bfa-popup__checkbox"
            type="checkbox">
          <span>
            <span id="character-journal-heading" class="bfa-popup__label">
              Character Journal tab
            </span>
            <span class="bfa-popup__hint">
              Adds a local Journal tab to D&amp;D Beyond character sheets.
            </span>
          </span>
        </label>
        <p
          id="character-journal-status"
          class="bfa-popup__status bfa-popup__status--hidden"
          aria-live="polite"></p>
      </section>

      <section class="bfa-popup__section" aria-labelledby="stored-art-heading">
        <div class="bfa-popup__section-header">
          <h2 id="stored-art-heading" class="bfa-popup__section-title">
            Stored full art
          </h2>
          <p id="stored-art-summary" class="bfa-popup__summary">
            Loading stored art...
          </p>
        </div>
        <p id="stored-art-empty" class="bfa-popup__empty" hidden>
          No local full art has been saved yet.
        </p>
        <ul id="stored-art-list" class="bfa-popup__stored-art-list"></ul>
        <p
          id="stored-art-status"
          class="bfa-popup__status bfa-popup__status--hidden"
          aria-live="polite"></p>
      </section>
    </main>
    <script src="./settings.js"></script>
  </body>
</html>
